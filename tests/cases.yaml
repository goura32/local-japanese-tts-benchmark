- id: l01
  type: long_form
  style: neutral
  text: "音声合成システムを実運用へ導入する際は、モデルの品質だけでなく、入力処理、再現性、監視、障害対応までを一つの流れとして設計する必要があります。まず、原稿を保存する形式を決めます。原文、読み、話者、スタイル、生成時刻、モデルの識別子を記録すると、後から同じ音声を作り直しやすくなります。漢字の読みが文脈で変わる日本語では、TTSへ渡す前に辞書や形態素解析を使い、必要なら発話用のかな原稿を別に用意します。原文を変更せず、raw inputとeffective inputを分けて保存することが重要です。次に、音声ファイルの形式を統一します。サンプリング周波数、チャンネル数、ビット深度、無音の扱いを固定し、保存前に検査します。長い文章では途中切断、同じ句の反復、極端な無音、音量の崩れ、速度の急変が起きることがあるため、波形と区間ごとの特徴量を自動的に確認します。生成時間はリアルタイム性の指標ではなく、バッチ処理の容量計画に使います。たとえば一時間分の原稿を夜間に処理するなら、平均の実時間比と失敗率から必要な並列数を見積もれます。ただし、GPUメモリが足りない状態で並列化すると、かえって再試行が増えます。まず一つのジョブを安定させ、ピークVRAMとピークRAMを測ってから同時実行数を増やします。評価は、生成音声をローカルSTTへ戻すround-tripだけで完了させてはいけません。STTは文脈を補正して、誤った発音でも正しい漢字を出す可能性があります。そのため、ひらがなまたは音素を出力する認識器、音素アラインメント、エンジンが返す読み情報などを組み合わせ、根拠の種類を明記します。評価器同士が一致しない場合は、人間の確認が必要です。全件試聴は避け、機械判定が不安定な代表例だけをhuman reviewへ回します。表現力については、neutral、cheerful、sad、angry、calm、energetic、whisper_or_soft、slow_explanatory、fast_excitedという共通意図を各エンジンの話者、スタイル、速度、音量、抑揚、自然言語指示へ対応付けます。完全に同じ表現にはならないため、どのパラメータへ変換したかを保存します。自然さの推定器を使う場合も、推定MOSを人間のMOSと混同せず、モデル名とバージョンを記録します。最後に、ライセンスをコード、モデル、生成音声に分けて確認します。公開リポジトリにはモデル本体、巨大キャッシュ、全量音声を入れず、取得元、固定バージョン、ハッシュ、利用条件、必要なクレジットだけを残します。これらを守ることで、品質を比較できるだけでなく、後から結果を再現し、問題が起きたときに原因を追跡できるベンチマークになります。"
