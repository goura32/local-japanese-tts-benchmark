[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-japanese-tts-benchmark"
version = "0.2.1"
description = "Reproducible benchmark harness for local Japanese TTS engines"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "psutil>=5.9",
  "requests>=2.31",
  "soundfile>=0.12",
]

[project.optional-dependencies]
evaluation = [
  "faster-whisper>=1.2,<2",
  "pyopenjtalk>=0.4",
  "scipy>=1.11",
  "torch>=2.1",
  "torchaudio>=2.1",
  "transformers>=4.47,<5",
]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
