      command: uv sync --all-extras
      status: failed
      exit_code: 1
      reason: upstream dependency graph stopped while extracting nvidia-nccl-cu12 with disk quota exceeded
    - route: source_existing_cuda
      command: python -m pip install -e upstream/index-tts --no-deps; install minimal runtime packages
      status: failed
      exit_code: 1
